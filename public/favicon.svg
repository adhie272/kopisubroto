<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bungee&amp;display=swap');
      .emblem-text {
        font-family: 'Bungee', cursive, sans-serif;
        font-size: 340px;
        fill: #5FA8A4;
